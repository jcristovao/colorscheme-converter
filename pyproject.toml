[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cscx"
version = "0.3.0"
description = "Convert terminal color schemes between nine formats, and into vim and neovim themes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
cscx = "cscx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cscx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
