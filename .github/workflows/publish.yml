# Publishes to PyPI over Trusted Publishing (OIDC) — no API token is stored
# anywhere. PyPI is told to trust this repository, this workflow filename and
# the `pypi` environment; nothing else can publish as `cscx`.
#
# To cut a release: bump the version in pyproject.toml, src/cscx/__init__.py
# and the man page header (the tests enforce that they agree), then push a
# matching tag:
#
#     git tag v0.17.0 && git push origin v0.17.0
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  # A release that fails its own test suite is worse than no release, and a
  # version number cannot be reused once PyPI has seen it.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[tui]' pytest
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      # Catches a README that PyPI would refuse to render, while the release
      # can still be abandoned.
      - run: twine check --strict dist/*
      - name: Fail if the tag disagrees with the packaged version
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "refs/tags/v$version" != "$GITHUB_REF" ]; then
            echo "tag $GITHUB_REF does not match pyproject version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required to mint the OIDC token PyPI verifies
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
